services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: hotel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password_here}
      POSTGRES_DB: ${DB_NAME:-hotel_kong_arthur}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hotel_admin} -d $${POSTGRES_DB:-hotel_kong_arthur}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - hotel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-backend
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hotel_kong_arthur}
      DB_USER: ${DB_USER:-hotel_admin}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password_here}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hotel-network

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: hotel-swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./specs/001-hotel-management/contracts/openapi.yaml:/spec/openapi.yaml:ro
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  postgres_data:
